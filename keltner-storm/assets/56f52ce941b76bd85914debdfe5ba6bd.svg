 -58.75281,-16.87498 -58.75281,-37.69131c0,-20.81633 26.30453,-37.69131 58.75281,-37.69131c32.44828,0 58.75281,16.87497 58.75281,37.6913z" fill="#23ce2b" stroke="#000000" stroke-width="0.5"></path><text transform="translate(227.8455,361.76365) scale(0.09429,0.09429)" font-size="40" xml:space="preserve" fill="#75461b" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">The Great Tree</tspan></text><text transform="translate(227.4415,109.57821) scale(0.08193,0.10999)" font-size="40" xml:space="preserve" fill="#75461b" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Things I can't do</tspan><tspan x="0" dy="46.150000000000006px">in college:</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Rely on parents</tspan><tspan x="0" dy="46.150000000000006px">for dinner</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Complain to</tspan><tspan x="0" dy="46.150000000000006px">teachers about</tspan><tspan x="0" dy="46.150000000000006px">assignments</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Forget the</tspan><tspan x="0" dy="46.150000000000006px">importance of each</tspan><tspan x="0" dy="46.150000000000006px">day I live</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Be 5 days late</tspan><tspan x="0" dy="46.150000000000006px">finishing a class</tspan><tspan x="0" dy="46.150000000000006px">assignment</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Make a Scratch</tspan><tspan x="0" dy="46.150000000000006px">project for a class</tspan><tspan x="0" dy="46.150000000000006px">that has no relation</tspan><tspan x="0" dy="46.150000000000006px">to Scratch</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">- Have Mr. Keltner</tspan><tspan x="0" dy="46.150000000000006px">as a teacher</tspan><tspan x="0" dy="46.150000000000006px">anymore 😢😢</tspan></text><path d="M231.10907,345.2872c-0.24949,-0.01594 -0.23355,-0.26543 -0.23355,-0.26543l0.03903,-0.37689c1.57258,-3.60847 1.96099,-5.99677 1.96011,-9.96003c-0.0121,-3.5084 -0.28547,-6.94911 -0.72809,-10.42555c-0.44272,-3.47765 -1.13445,-6.8916 -1.58267,-10.36878c-0.5104,-3.4691 -0.89095,-6.91517 -1.36857,-10.39474c-0.47239,-3.47038 0.17939,-7.05255 0.17986,-10.51066c0.01182,-3.52442 0.35634,-6.97359 1.03384,-10.4222c0.25614,-3.60255 0.95158,-6.63149 0.33472,-10.27576c-1.28946,-2.90657 -1.61874,-5.55906 -1.61874,-8.74944c0,0 0,-0.25 0.25,-0.25c0.25,0 0.25,0.25 0.25,0.25c0,3.16424 0.3368,5.71436 1.5975,8.60526c0.65217,3.71716 -0.04976,6.81049 -0.31786,10.486c-0.66757,3.43134 -1.0177,6.85112 -1.02946,10.35703c-0.00046,3.43254 -0.66143,6.99807 -0.1845,10.44179c0.47763,3.47958 0.85827,6.92532 1.36852,10.39438c0.44857,3.47885 1.14031,6.89458 1.58336,10.37399c0.44522,3.49691 0.71992,6.95877 0.73209,10.48778c0.00089,4.01221 -0.40848,6.5048 -2.00174,10.16071l0.00159,0.20901c0,0 -0.01594,0.24949 -0.26543,0.23355z" fill="#75461b" stroke="none" stroke-width="0.5"></path><path d="M236.62136,266.99511c0.03773,0.21822 -0.15127,0.27656 -0.19492,0.28703c-0.93165,2.21505 -0.34185,5.83019 -0.11285,8.17066c0.3432,3.5076 0.31124,6.98869 0.31172,10.51029c0.0057,3.39077 0.07565,7.07794 0.59502,10.42514c0.53222,3.45992 0.61184,6.90463 1.30479,10.37691c0.63068,3.16125 